[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "astrosense-guiding"
version = "0.1.0"
description = "PHD2 guide-log analysis: periodic error, backlash, vibration, and predictive-guiding groundwork"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
astrosense = "astrosense_guiding.cli:main"

[project.urls]
Repository = "https://github.com/Aoi-Morio/astrosense-guiding"
Issues = "https://github.com/Aoi-Morio/astrosense-guiding/issues"

[tool.setuptools.packages.find]
include = ["astrosense_guiding*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
